<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QUANG HUY </title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#020617;
  --card:rgba(15,23,42,.72);
  --card2:#111827;
  --border:rgba(255,255,255,.06);

  --text:#f8fafc;
  --muted:#94a3b8;

  --purple:#8b5cf6;
  --pink:#ec4899;
  --green:#22c55e;
  --red:#f43f5e;
  --blue:#38bdf8;

  --shadow:0 10px 35px rgba(0,0,0,.25);
}

body.light{
  --bg:#eef2ff;
  --card:rgba(255,255,255,.82);
  --card2:#ffffff;
  --border:rgba(0,0,0,.06);

  --text:#0f172a;
  --muted:#475569;

  --shadow:0 10px 35px rgba(0,0,0,.08);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  padding:30px 15px;
  font-family:'Plus Jakarta Sans',sans-serif;
  color:var(--text);

  background:
  radial-gradient(circle at top left,#312e81 0%,transparent 30%),
  radial-gradient(circle at bottom right,#1d4ed8 0%,transparent 30%),
  var(--bg);

  transition:.25s;
}

.container{
  max-width:1400px;
  margin:auto;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;

  margin-bottom:25px;
  padding:24px;

  border-radius:28px;

  background:var(--card);
  border:1px solid var(--border);

  backdrop-filter:blur(16px);
  box-shadow:var(--shadow);
}

.logo{
  font-size:30px;
  font-weight:800;

  background:linear-gradient(
    90deg,
    #a78bfa,
    #ec4899
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.top-right{
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}

.clock{
  font-weight:700;
  color:var(--blue);
}

.theme-btn{
  border:none;
  cursor:pointer;

  padding:11px 16px;

  border-radius:14px;

  background:#7c3aed;
  color:white;

  font-weight:700;
}

select,
input{
  background:rgba(0,0,0,.25);
  border:1px solid var(--border);

  color:var(--text);

  padding:12px 14px;

  border-radius:14px;

  outline:none;
}

body.light select,
body.light input{
  background:white;
}

.btn{
  border:none;
  cursor:pointer;

  padding:12px 18px;

  border-radius:14px;

  font-weight:700;

  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-p{
  background:#7c3aed;
  color:white;
}

.btn-d{
  background:#f43f5e;
  color:white;
}

.btn-e{
  background:#0ea5e9;
  color:white;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;

  margin-bottom:25px;
}

.card{
  position:relative;
  overflow:hidden;

  background:var(--card);
  border:1px solid var(--border);

  border-radius:24px;

  padding:24px;

  backdrop-filter:blur(16px);

  box-shadow:var(--shadow);

  transition:.25s;
}

.card:hover{
  transform:translateY(-4px);
}

.card::after{
  content:'';

  position:absolute;
  top:-40px;
  right:-40px;

  width:120px;
  height:120px;

  border-radius:50%;

  background:rgba(255,255,255,.04);
}

.label{
  color:var(--muted);
  font-size:14px;
}

.value{
  margin-top:10px;

  font-size:32px;
  font-weight:800;

  display:flex;
  align-items:center;
  gap:10px;
}

.plus{
  color:var(--green);
  text-shadow:0 0 14px rgba(34,197,94,.7);
}

.minus{
  color:var(--red);
  text-shadow:0 0 14px rgba(244,63,94,.7);
}

.tabs{
  display:flex;
  gap:12px;
  flex-wrap:wrap;

  margin-bottom:20px;
}

.tab{
  padding:12px 20px;

  border-radius:14px;

  background:#1e293b;

  cursor:pointer;

  font-weight:700;

  transition:.2s;
}

body.light .tab{
  background:#dbeafe;
}

.tab.active{
  background:#7c3aed;
  color:white;
}

.main{
  background:var(--card);
  border:1px solid var(--border);

  border-radius:28px;

  padding:25px;

  backdrop-filter:blur(16px);

  box-shadow:var(--shadow);
}

.toolbar{
  display:flex;
  gap:12px;
  flex-wrap:wrap;

  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
}

td{
  padding:15px;
  border-bottom:1px solid var(--border);
}

.schedule-wrap{
  overflow-x:auto;
}

.grid{
  min-width:900px;

  display:grid;
  grid-template-columns:90px repeat(5,1fr);

  gap:8px;
}

.grid-head{
  text-align:center;
  font-weight:700;
}

.price-box{
  background:#1e293b;

  border-radius:12px;

  padding:8px;

  text-align:center;

  cursor:pointer;

  transition:.2s;

  font-size:14px;
  font-weight:700;
}

body.light .price-box{
  background:#dbeafe;
}

.price-box:hover{
  transform:scale(1.03);
}

.price-box.active{
  background:#10b981;
  color:white;

  box-shadow:0 0 14px rgba(16,185,129,.7);
}

.chart-box{
  margin-top:25px;
}

.toast{
  position:fixed;

  right:20px;
  bottom:20px;

  background:#10b981;
  color:white;

  padding:14px 18px;

  border-radius:14px;

  font-weight:700;

  transform:translateY(120px);
  opacity:0;

  transition:.35s;

  z-index:999;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.warning{
  margin-top:20px;

  padding:16px;

  border-radius:18px;

  background:rgba(244,63,94,.15);

  border:1px solid rgba(244,63,94,.3);

  color:#fecdd3;

  font-weight:700;

  display:none;
}

.daily{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:14px;

  margin-top:25px;
}

.day-card{
  background:rgba(255,255,255,.03);

  border:1px solid var(--border);

  border-radius:18px;

  padding:16px;

  text-align:center;
}

.edit-modal{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.6);

  display:none;

  align-items:center;
  justify-content:center;

  z-index:999;
}

.modal-box{
  width:100%;
  max-width:400px;

  background:var(--card2);

  border-radius:24px;

  padding:25px;
}

.modal-actions{
  display:flex;
  gap:12px;

  margin-top:18px;
}

@media(max-width:768px){

  header{
    flex-direction:column;
    align-items:flex-start;
  }

  .value{
    font-size:24px;
  }

}
</style>
</head>

<body>

<div class="toast" id="toast">
  Đã lưu dữ liệu ✓
</div>

<div class="edit-modal" id="editModal">

  <div class="modal-box">

    <h2>Chỉnh sửa nhân viên</h2>

    <input id="editName" placeholder="Tên">

    <br><br>

    <input id="editSalary"
           type="number"
           placeholder="Lương">

    <div class="modal-actions">

      <button class="btn btn-p"
              onclick="saveEdit()">
        Lưu
      </button>

      <button class="btn btn-d"
              onclick="closeEdit()">
        Hủy
      </button>

    </div>

  </div>

</div>

<div class="container">

<header>

  <div class="logo">
    CRY MORE
  </div>

  <div class="top-right">

    <div class="clock"
         id="clock">
      00:00:00
    </div>

    <button class="theme-btn"
            onclick="toggleTheme()">
      🌙 Theme
    </button>

    <select id="weekSelect"></select>

    <button class="btn btn-p"
            onclick="addWeek()">
      + Tuần
    </button>

    <button class="btn btn-d"
            onclick="deleteWeek()">
      Xóa
    </button>

  </div>

</header>

<div class="stat-grid">

  <div class="card">
    <div class="label">🍜 Tổng thu</div>
    <div class="value" id="sFood">0</div>
  </div>

  <div class="card">
    <div class="label">💸 Tổng chi</div>
    <div class="value" id="sOut">0</div>
  </div>

  <div class="card">
    <div class="label">📈 Lợi nhuận tuần</div>
    <div class="value" id="sProfit">0</div>
  </div>

  <div class="card">
    <div class="label">💰 Lợi nhuận tháng</div>
    <div class="value" id="mProfit">0</div>
  </div>

</div>

<div class="tabs">

  <div class="tab active"
       onclick="showTab('salary',event)">
    Lương
  </div>

  <div class="tab"
       onclick="showTab('schedule',event)">
    Đăng ký
  </div>

  <div class="tab"
       onclick="showTab('food',event)">
    Thu nhập
  </div>

</div>

<div class="main">

<div id="salary">

  <div class="toolbar">

    <input id="nameInput"
           placeholder="Tên nhân viên">

    <input id="salaryInput"
           type="number"
           placeholder="Lương">

    <button class="btn btn-p"
            onclick="addSalary()">
      Thêm
    </button>

  </div>

  <table>
    <tbody id="salaryBody"></tbody>
  </table>

</div>

<div id="schedule"
     style="display:none">

  <div class="schedule-wrap">
    <div class="grid"
         id="scheduleGrid"></div>
  </div>

</div>

<div id="food"
     style="display:none">

  <div class="toolbar">

    <input id="foodInput"
           type="number"
           placeholder="Nhập doanh thu">

    <button class="btn btn-p"
            onclick="addFood()">
      Cộng
    </button>

  </div>

</div>

<div class="warning"
     id="warning">
  ⚠ Tuần này đang lỗ
</div>

<div class="daily"
     id="dailyStats"></div>

<div class="chart-box">
  <canvas id="profitChart"></canvas>
</div>

</div>
</div>

<script>
const weekSelect =
document.getElementById("weekSelect");

const nameInput =
document.getElementById("nameInput");

const salaryInput =
document.getElementById("salaryInput");

const foodInput =
document.getElementById("foodInput");

const salaryBody =
document.getElementById("salaryBody");

const scheduleGrid =
document.getElementById("scheduleGrid");

const toast =
document.getElementById("toast");

const warning =
document.getElementById("warning");

const dailyStats =
document.getElementById("dailyStats");

const sFood =
document.getElementById("sFood");

const sOut =
document.getElementById("sOut");

const sProfit =
document.getElementById("sProfit");

const mProfit =
document.getElementById("mProfit");

const DAYS =
["T2","T3","T4","T5","T6","T7","CN"];

const TIMES =
["13h","15h","20h","21h50","23h30"];

const PRICES =
[4000,6000,7000,8000,25000];

let editIndex = null;

let data =
JSON.parse(localStorage.getItem("app"))
||
[
  {
    name:"Tuần 1",
    salary:[],
    food:0,
    schedule:{}
  }
];

let current = 0;

function showToast(){

  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },1800);
}

function save(){

  localStorage.setItem(
    "app",
    JSON.stringify(data)
  );

  showToast();

  renderAll();
}

function renderWeekSelect(){

  weekSelect.innerHTML =
  data.map((w,i)=>`
    <option value="${i}">
      ${w.name}
    </option>
  `).join('');

  weekSelect.value = current;
}

weekSelect.onchange = ()=>{

  current =
  Number(weekSelect.value);

  renderAll();
};

function addWeek(){

  data.push({
    name:"Tuần "+(data.length+1),
    salary:[],
    food:0,
    schedule:{}
  });

  current = data.length-1;

  save();
}

function deleteWeek(){

  if(!confirm("Xóa tuần?"))
    return;

  data.splice(current,1);

  if(data.length===0){

    data = [{
      name:"Tuần 1",
      salary:[],
      food:0,
      schedule:{}
    }];
  }

  current =
  Math.max(0,current-1);

  save();
}

function addSalary(){

  let name =
  nameInput.value.trim();

  let salary =
  Number(salaryInput.value);

  if(name && !isNaN(salary)){

    data[current].salary.push({
      name,
      salary
    });

    nameInput.value='';
    salaryInput.value='';

    save();
  }
}

function deleteSalary(i){

  if(confirm("Xóa nhân viên?")){

    data[current]
    .salary.splice(i,1);

    save();
  }
}

function editSalary(i){

  editIndex = i;

  document
  .getElementById("editModal")
  .style.display = "flex";

  document
  .getElementById("editName")
  .value =
  data[current].salary[i].name;

  document
  .getElementById("editSalary")
  .value =
  data[current].salary[i].salary;
}

function closeEdit(){

  document
  .getElementById("editModal")
  .style.display = "none";
}

function saveEdit(){

  data[current]
  .salary[editIndex]
  .name =
  document.getElementById("editName").value;

  data[current]
  .salary[editIndex]
  .salary =
  Number(
    document.getElementById("editSalary").value
  );

  closeEdit();

  save();
}

function addFood(){

  let val =
  Number(foodInput.value);

  if(!isNaN(val)){

    data[current].food += val;

    foodInput.value='';

    save();
  }
}

function togglePrice(day,time,price){

  let key =
  day + "-" + time;

  let sch =
  data[current].schedule;

  sch[key] =
  sch[key] === price ? 0 : price;

  save();
}

function renderSchedule(){

  let html =
  "<div></div>" +
  TIMES.map(t=>`
    <div class='grid-head'>
      ${t}
    </div>
  `).join('');

  DAYS.forEach(day=>{

    html += `
      <div class='grid-head'>
        ${day}
      </div>
    `;

    TIMES.forEach(time=>{

      let key =
      day + "-" + time;

      let val =
      data[current]
      .schedule[key] || 0;

      html += `
      <div>

      ${
        PRICES.map(p=>`

          <div
            class='price-box ${val===p?'active':''}'
            onclick="
              togglePrice(
                '${day}',
                '${time}',
                ${p}
              )
            "
          >
            ${p/1000}k
          </div>

        `).join('')
      }

      </div>
      `;
    });
  });

  scheduleGrid.innerHTML = html;
}

function renderDaily(){

  let html = '';

  DAYS.forEach(day=>{

    let total = 0;

    TIMES.forEach(time=>{

      let key =
      day + "-" + time;

      total +=
      data[current]
      .schedule[key] || 0;
    });

    html += `
      <div class='day-card'>
        <div>${day}</div>

        <h3>
          ${total.toLocaleString()}đ
        </h3>
      </div>
    `;
  });

  dailyStats.innerHTML = html;
}

let chart;

function renderChart(){

  let profits =
  data.map(w=>{

    let sal =
    w.salary.reduce(
      (s,x)=>s+x.salary,
      0
    );

    let sched =
    Object.values(w.schedule)
    .reduce((s,x)=>s+x,0);

    return w.food - (sal+sched);
  });

  let ctx =
  document
  .getElementById("profitChart");

  if(chart)
    chart.destroy();

  chart = new Chart(ctx,{
    type:'line',

    data:{
      labels:
      data.map(x=>x.name),

      datasets:[
        {
          label:'Lợi nhuận',

          data:profits,

          borderColor:'#8b5cf6',

          backgroundColor:
          'rgba(139,92,246,.2)',

          tension:.4,

          fill:true
        }
      ]
    },

    options:{
      responsive:true
    }
  });
}

function renderSalary(){

  salaryBody.innerHTML =
  data[current]
  .salary.map((s,i)=>`

    <tr>

      <td>${s.name}</td>

      <td>
        ${s.salary.toLocaleString()}đ
      </td>

      <td>

        <button
          class='btn btn-e'
          onclick='editSalary(${i})'
        >
          Edit
        </button>

      </td>

      <td>

        <button
          class='btn btn-d'
          onclick='deleteSalary(${i})'
        >
          Xóa
        </button>

      </td>

    </tr>

  `).join('');
}

function showTab(id,e){

  document
  .querySelectorAll(
    '#salary,#schedule,#food'
  )
  .forEach(
    x=>x.style.display='none'
  );

  document
  .getElementById(id)
  .style.display='block';

  document
  .querySelectorAll('.tab')
  .forEach(
    x=>x.classList.remove('active')
  );

  e.target.classList.add('active');
}

function updateClock(){

  document
  .getElementById("clock")
  .innerText =
  new Date().toLocaleTimeString();
}

setInterval(updateClock,1000);

function toggleTheme(){

  document.body.classList.toggle("light");

  localStorage.setItem(
    "theme",

    document.body.classList.contains("light")
    ? "light"
    : "dark"
  );
}

if(
  localStorage.getItem("theme")
  === "light"
){
  document.body.classList.add("light");
}

function renderAll(){

  renderWeekSelect();

  renderSchedule();

  renderSalary();

  renderDaily();

  renderChart();

  let w = data[current];

  let totalSalary =
  w.salary.reduce(
    (s,x)=>s+x.salary,
    0
  );

  let totalSchedule =
  Object.values(w.schedule)
  .reduce((s,x)=>s+x,0);

  let totalOut =
  totalSalary + totalSchedule;

  let profit =
  w.food - totalOut;

  sFood.innerHTML =
  `🍜 ${w.food.toLocaleString()}đ`;

  sOut.innerHTML =
  `💸 ${totalOut.toLocaleString()}đ`;

  sProfit.innerHTML =
  `${profit>=0?'📈':'📉'}
  ${profit.toLocaleString()}đ`;

  sProfit.className =
  "value " +
  (
    profit>=0
    ? "plus"
    : "minus"
  );

  let month =
  data.reduce((a,c)=>{

    let out =
    c.salary.reduce(
      (s,x)=>s+x.salary,
      0
    )
    +
    Object.values(c.schedule)
    .reduce((s,x)=>s+x,0);

    return a + (c.food - out);

  },0);

  mProfit.innerHTML =
  `${month>=0?'💰':'🔥'}
  ${month.toLocaleString()}đ`;

  mProfit.className =
  "value " +
  (
    month>=0
    ? "plus"
    : "minus"
  );

  warning.style.display =
  profit < 0
  ? "block"
  : "none";
}

renderAll();
updateClock();
</script>

</body>
</html>
